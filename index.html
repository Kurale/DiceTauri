<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiceTauri Platformer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%230f172a%27/%3E%3Ccircle cx=%2732%27 cy=%2732%27 r=%2718%27 fill=%27%2322d3ee%27/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />

<body>
  <main class="game-layout">

      <canvas id="gameCanvas" width="960" height="540" aria-label="Игровое поле" role="img"></canvas>
    </section>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
